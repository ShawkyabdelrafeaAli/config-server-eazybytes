server:
  port: 9000  # The Accounts microservice runs on port 9000

spring:
  datasource:
    url: jdbc:mysql://localhost:3308/cardsdb
    username: root
    password: 682000
    driver-class-name: com.mysql.cj.jdbc.Driver  # ✅ Ensure this is specified
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect  # ✅ Recommended way to specify dialect
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: update
    show-sql: true

build:
  version: "1.0"

