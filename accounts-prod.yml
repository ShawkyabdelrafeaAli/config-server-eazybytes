server:
  port: 9001  # The Accounts microservice runs on port 9001

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/accountsdb
    username: root
    password: 682000
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: update
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: "*"

build:
  version: "1.0"

