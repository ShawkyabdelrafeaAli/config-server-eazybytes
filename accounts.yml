server:
  port: 9001  # The Accounts microservice runs on port 9001

spring:
  application:
    name: "accounts"
  datasource:
    url: jdbc:mysql://localhost:3306/session2
    username: root
    password: 682000
    driver-class-name: com.mysql.cj.jdbc.Driver  # ✅ Ensure driver is specified
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect  # ✅ Recommended way to specify dialect
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: update
    show-sql: true
  config:
    import:
      - "accounts_qa.yml"
      - "accounts_prod.yml"
    activate:
      on-profile: "prod"  # ✅ Correct way to activate a profile

build:
  version: "3.0"
